# The judge's side of the project, on each pull request: the question the hive's judge asks of the project's tip
# itself (« does the machine work? », docs/relay-judge.md of Bee-ruche/hive): the manifest and its bounds, the tip's
# build, its two encodings of the corpus and its decoding, each in the judge's own containers, behind its gate. No
# candidate is judged here. Then a known failure, so that the check is seen to fail when it should: the same tip with
# a word the project's rule refuses must stop at the tip's build, for that reason and no other.
#
# The judge is Bee-ruche/hive's, at the commit .github/workflows/hive.yml runs: move both together (the check fails
# when they differ). The project's code runs only in the judge's containers, without network; this workflow holds no
# secret and reads only. It runs the pull request's own copy of itself: it tells mistakes, it does not guard against
# a pull request that changes it (who merges reads that).
name: Judge check
on:
  pull_request:
permissions:
  contents: read

jobs:
  tip-itself:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: project
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/hive
          ref: 29d05b89cde1e07c9f8231414280aaf3bff767b3
          path: protocol
          persist-credentials: false
      - name: The judge is the one the project's hourly run names
        run: |
          judged="$(git -C protocol rev-parse HEAD)"
          runs="$(sed -n 's|^ *uses: Bee-ruche/hive/\.github/workflows/run\.yml@\([0-9a-f]\{40\}\)$|\1|p' project/.github/workflows/hive.yml)"
          echo "this check judges with Bee-ruche/hive at $judged; hive.yml runs $runs"
          [ "$judged" = "$runs" ] || { echo "::error::move this workflow's judge and hive.yml's commit together"; exit 1; }
      - name: The tip, written out without its repository (the judge refuses a tree that is one)
        run: |
          mkdir tip
          git -C project archive HEAD | tar -x -C tip
      - name: The judge's images (with network; the hive's own Dockerfile and the empty image, nothing of the project)
        run: python3 -B protocol/tools/judge/relay.py --tip "$GITHUB_WORKSPACE/tip" --image-only
      - name: The tip itself, then a known failure (the project's code runs only in the judge's containers, without network)
        run: |
          python3 -B - <<'EOF'
          import json, os, shutil, subprocess, sys, time
          here = os.environ["GITHUB_WORKSPACE"]
          tip, broken, work, reports = (os.path.join(here, name) for name in ("tip", "broken", "work", "reports"))
          budget = int(json.load(open(os.path.join(tip, "hive/project.json")))["judge"]["timeout_seconds"])
          os.makedirs(reports)

          def judge(tree):
              """The judge's code, and its report: the step it reached, its figures or the reason it stopped."""
              name = os.path.basename(tree)
              report = os.path.join(reports, f"{name}.json")
              command = [sys.executable, "-B", os.path.join(here, "protocol/tools/judge/relay.py"), "--tip", tree, "--tip-itself",
                         "--budget", str(budget), "--workdir", work, "--json", report]
              start = time.monotonic()
              print(f"::group::{name}", flush=True)
              code = subprocess.run(command).returncode
              print("::endgroup::", flush=True)
              said = json.load(open(report)) if os.path.exists(report) else {}
              figures = ", ".join(f"{key} {said.get(key)}" for key in ("total_bytes", "message_bytes", "program_bytes", "encode_seconds",
                                                                        "decode_seconds", "encode_memory_kb", "decode_memory_kb", "builds", "runs"))
              print(f"{name}: code {code}, step {said.get('step')}, {time.monotonic() - start:.1f} s, " + said.get("reason", figures), flush=True)
              return code, said

          failed = []
          code, said = judge(tip)
          if code != 0 or said.get("step") != 4:
              failed.append("the tip itself was not judged right")
          # A known failure: the same tip (its links kept as links) with a word the project's rule refuses, in a comment
          # of the program, must stop at the tip's build, said to be on the tip's side.
          shutil.copytree(tip, broken, symlinks=True)
          with open(os.path.join(broken, "src/coder.rs"), "a") as f:
              f.write("\n// a known failure, so that the check is seen to fail when it should: unsafe\n")
          code, said = judge(broken)
          reason = said.get("reason", "")
          if code != 2 or said.get("step") != 3 or said.get("fault") != "tip" or "the tip's build" not in reason or "unsafe" not in reason:
              failed.append("the known failure (a word the rule refuses) was not told as it should be")
          sys.exit("the judge check failed: " + "; ".join(failed) if failed else 0)
          EOF
